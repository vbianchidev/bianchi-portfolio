<section id="about-me" class="bui-section">
  <app-section-title
    [title]="'ABOUT-EXPERIENCE.TITLE' | translate"
    [sectionName]="'ABOUT-EXPERIENCE.SECTION-NAME' | translate"
  ></app-section-title>

  <div class="experiences d-flex flex-col gap-4">
    @for (experience of experiences; track $index) {
      <div class="experience d-flex flex-col gap-1">
        <div class="d-flex gap-2 align-items-baseline">
          <h3>
            {{ experience.company }}
          </h3>
          <strong>{{ experience.role }}</strong>
        </div>

        <p class="date">
          {{ experience.startDate | date: 'MMM yyyy' }} -
          {{ experience.endDate | date: 'MMM yyyy' }}
        </p>
        <p>{{ experience.description }}</p>
      </div>
    }
  </div>
</section>
